<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DNA Launcher" />
  <title>DNA Launcher OS — Hologram PWA</title>
  <link id="pwa-manifest-link" rel="manifest" href="./manifest.json" />
  <link id="apple-icon-link" rel="apple-touch-icon" href="./icon-512.svg" />
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="./icon-512.svg" />

  <style>
    :root {
      --bg-primary: #030712;
      --glass-bg: rgba(10, 18, 34, 0.58);
      --glass-border: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #00f5d4;
      --accent-2: #d946ef;
      --holo-cyan: #00f5d4;
      --holo-magenta: #ff2a85;
      --holo-blue: #38bdf8;
      --icon-size: 62px;
      --icon-radius: 20px;
      --grid-cols: 4;
      --wallpaper: radial-gradient(circle at 20% 15%, rgba(0, 245, 212, 0.16), transparent 42%),
                   radial-gradient(circle at 82% 25%, rgba(217, 70, 239, 0.18), transparent 45%),
                   radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.22), transparent 55%),
                   linear-gradient(160deg, #02040a 0%, #071124 48%, #040814 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
    }

    #wallpaper-layer {
      position: fixed;
      inset: 0;
      background: var(--wallpaper);
      z-index: 0;
      transition: background 0.5s ease;
    }

    #grid-floor {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 245, 212, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 212, 0.045) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(circle at 50% 50%, black 35%, transparent 90%);
      pointer-events: none;
      z-index: 1;
    }

    #launcher-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 10px) 16px env(safe-area-inset-bottom, 14px);
    }

    /* Barra de Status */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dna-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(0, 245, 212, 0.12);
      border: 1px solid rgba(0, 245, 212, 0.35);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0, 245, 212, 0.6);
    }

    .dna-badge img {
      width: 15px;
      height: 15px;
      border-radius: 4px;
    }

    .status-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .holo-pill-btn {
      background: rgba(0, 245, 212, 0.14);
      border: 1px solid rgba(0, 245, 212, 0.45);
      color: #00f5d4;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.25);
    }

    .holo-pill-btn.off {
      background: rgba(148, 163, 184, 0.12);
      border-color: rgba(148, 163, 184, 0.3);
      color: #94a3b8;
      box-shadow: none;
    }

    #install-pwa-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #00f5d4, #38bdf8);
      color: #030712;
      border: none;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 245, 212, 0.5);
      animation: pulseGlow 2.2s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(0, 245, 212, 0.45); }
      50% { box-shadow: 0 0 18px rgba(0, 245, 212, 0.9); }
    }

    /* Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      gap: 10px;
    }

    /* Widgets */
    .dna-widgets-row {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 10px;
    }

    .widget-card {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 12px 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .clock-big {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      background: linear-gradient(90deg, #ffffff, #7dd3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .date-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: capitalize;
    }

    .weather-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      font-size: 10px;
      color: #bae6fd;
      background: rgba(56, 189, 248, 0.12);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .music-widget {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .music-title {
      font-size: 12px;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-artist {
      font-size: 10px;
      color: var(--accent);
      margin-top: 2px;
    }

    .music-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .m-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 12px;
    }

    .m-btn.play {
      background: linear-gradient(135deg, var(--accent), var(--holo-blue));
      color: #030712;
      font-weight: 800;
      border: none;
    }

    /* Botões Rápidos */
    .quick-holo-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-holo-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(0, 245, 212, 0.12);
      border: 1px solid rgba(0, 245, 212, 0.4);
      color: #a5f3fc;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .action-holo-btn.web {
      background: rgba(217, 70, 239, 0.14);
      border-color: rgba(217, 70, 239, 0.42);
      color: #f5d0fe;
    }

    /* Busca */
    .search-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 8px 14px;
      backdrop-filter: blur(14px);
    }

    .search-pill input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
    }

    .search-pill input::placeholder {
      color: #64748b;
    }

    /* Grade de Apps */
    .apps-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(var(--grid-cols), 1fr);
      align-content: start;
      gap: 16px 10px;
      padding: 6px 2px 14px;
      overflow-y: auto;
      scrollbar-width: none;
      perspective: 900px;
    }

    .apps-grid::-webkit-scrollbar {
      display: none;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .app-item:active {
      transform: scale(0.91);
    }

    .app-icon-wrap {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: var(--icon-radius);
      display: grid;
      place-items: center;
      position: relative;
      font-size: 27px;
      background: var(--app-bg, linear-gradient(135deg, #1e293b, #0f172a));
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      transition: all 0.3s ease;
    }

    .app-icon-wrap img.favicon-holo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      object-fit: cover;
      position: relative;
      z-index: 2;
    }

    .web-tag {
      position: absolute;
      top: -5px;
      right: -5px;
      z-index: 4;
      background: linear-gradient(135deg, #d946ef, #38bdf8);
      color: #fff;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 6px;
      letter-spacing: 0.4px;
      box-shadow: 0 0 8px rgba(217, 70, 239, 0.8);
    }

    .app-label {
      font-size: 11px;
      font-weight: 500;
      color: #e2e8f0;
      text-align: center;
      max-width: 74px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    /* =========================================================
       MODO HOLOGRAMA 3D
       ========================================================= */
    body.holo-mode .app-item {
      animation: holoFloat 3.6s ease-in-out infinite;
      animation-delay: calc(var(--idx, 0) * -0.28s);
    }

    body.holo-mode .app-icon-wrap {
      background: radial-gradient(circle at 30% 25%, rgba(0, 245, 212, 0.28), rgba(14, 165, 233, 0.12) 60%, rgba(217, 70, 239, 0.18));
      border: 1.5px solid rgba(0, 245, 212, 0.65);
      box-shadow:
        0 0 18px rgba(0, 245, 212, 0.38),
        0 0 32px rgba(56, 189, 248, 0.2),
        inset 0 0 14px rgba(0, 245, 212, 0.35);
      backdrop-filter: blur(6px);
      overflow: visible;
    }

    body.holo-mode .app-icon-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 245, 212, 0.22) 0px,
        rgba(0, 245, 212, 0.22) 1px,
        transparent 1px,
        transparent 4px
      );
      pointer-events: none;
      animation: scanMove 2.8s linear infinite;
      opacity: 0.75;
    }

    body.holo-mode .app-icon-wrap::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 14%;
      width: 72%;
      height: 5px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 245, 212, 0.95) 0%, rgba(56, 189, 248, 0.4) 55%, transparent 80%);
      filter: blur(1.5px);
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.9);
      pointer-events: none;
    }

    body.holo-mode .app-glyph,
    body.holo-mode .favicon-holo {
      position: relative;
      z-index: 2;
      filter: drop-shadow(-1.5px 0 0 rgba(255, 42, 133, 0.85))
              drop-shadow(1.5px 0 0 rgba(0, 245, 212, 0.9))
              drop-shadow(0 0 8px rgba(56, 189, 248, 0.85));
      transform: translateZ(14px);
    }

    body.holo-mode .app-label {
      color: #a5f3fc;
      text-shadow: 0 0 8px rgba(0, 245, 212, 0.65);
      letter-spacing: 0.2px;
    }

    body.holo-cyan .app-icon-wrap {
      border-color: rgba(56, 189, 248, 0.8);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.45), inset 0 0 14px rgba(56, 189, 248, 0.35);
    }

    body.holo-solar .app-icon-wrap {
      background: radial-gradient(circle at 30% 25%, rgba(251, 191, 36, 0.28), rgba(244, 63, 94, 0.16));
      border-color: rgba(251, 191, 36, 0.8);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.42), inset 0 0 14px rgba(244, 63, 94, 0.35);
    }

    body.holo-solar .app-label {
      color: #fde68a;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.65);
    }

    @keyframes holoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes scanMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 24px; }
    }

    /* Dock Inferior */
    .dock-bar {
      background: rgba(10, 18, 34, 0.72);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(0, 245, 212, 0.28);
      border-radius: 26px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    }

    .dock-bar .app-item { gap: 0; }
    .dock-bar .app-icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 17px;
      font-size: 23px;
    }

    /* Modais & Sheets */
    .overlay-sheet {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(3, 7, 18, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: none;
      flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 18px env(safe-area-inset-bottom, 18px);
      animation: fadeUp 0.22s ease;
    }

    .overlay-sheet.open { display: flex; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .mini-app-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Cartão de Instalação com Foto/Ícone do App */
    .install-hero-card {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(6, 78, 59, 0.35));
      border: 1.5px solid rgba(0, 245, 212, 0.55);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      box-shadow: 0 0 28px rgba(0, 245, 212, 0.2);
    }

    .app-photo-preview {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      border: 2px solid #00f5d4;
      box-shadow: 0 0 24px rgba(0, 245, 212, 0.6), 0 0 40px rgba(217, 70, 239, 0.35);
      object-fit: cover;
      background: #030712;
    }

    .step-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 13px;
      font-size: 12px;
      line-height: 1.55;
      color: #cbd5e1;
      text-align: left;
    }

    /* Indexador de Apps da Play Store */
    .indexer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .indexer-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 16px;
      padding: 11px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .indexer-card.selected {
      background: rgba(0, 245, 212, 0.18);
      border-color: #00f5d4;
      box-shadow: 0 0 14px rgba(0, 245, 212, 0.28);
    }

    .indexer-card .ic-emoji { font-size: 25px; }
    .indexer-card .ic-name { font-size: 11px; font-weight: 700; color: #f8fafc; }
    .indexer-card .ic-status { font-size: 9px; color: #00f5d4; font-weight: 800; }

    /* Formulários */
    .holo-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 245, 212, 0.35);
      border-radius: 18px;
      padding: 14px;
    }

    .holo-input {
      width: 100%;
      background: rgba(2, 6, 23, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .holo-primary-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00f5d4, #38bdf8);
      color: #030712;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0, 245, 212, 0.35);
      background: rgba(0, 245, 212, 0.1);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: #00f5d4;
      color: #030712;
      font-weight: 800;
    }

    .chip.danger {
      border-color: rgba(244, 63, 94, 0.5);
      background: rgba(244, 63, 94, 0.15);
      color: #fda4af;
    }

    .calc-display {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 245, 212, 0.3);
      border-radius: 16px;
      padding: 18px;
      text-align: right;
      font-size: 32px;
      font-weight: 800;
      color: #00f5d4;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .calc-key {
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 41, 59, 0.7);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .calc-key.op {
      background: rgba(0, 245, 212, 0.18);
      color: #00f5d4;
      border-color: rgba(0, 245, 212, 0.4);
    }

    .notes-area {
      flex: 1;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 245, 212, 0.3);
      border-radius: 16px;
      padding: 14px;
      color: #f8fafc;
      font-size: 15px;
      resize: none;
      outline: none;
    }

    .setting-group {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
  </style>
</head>
<body class="holo-mode">
  <div id="wallpaper-layer"></div>
  <div id="grid-floor"></div>

  <div id="launcher-shell">
    <!-- Barra Superior -->
    <header class="status-bar">
      <div class="status-left">
        <span class="dna-badge">
          <img id="top-app-icon" src="./icon-512.svg" alt="DNA" />
          DNA OS
        </span>
        <span id="status-clock">21:10</span>
      </div>
      <div class="status-actions">
        <button id="install-pwa-btn" onclick="openInstallModal()">📲 BAIXAR APP</button>
        <button id="holo-toggle-btn" class="holo-pill-btn">HOLO ON</button>
        <span id="battery-txt">100% ⚡</span>
      </div>
    </header>

    <!-- Área Principal -->
    <main class="workspace">
      <!-- Widgets -->
      <section class="dna-widgets-row">
        <div class="widget-card">
          <div class="clock-big" id="widget-clock">21:10</div>
          <div class="date-sub" id="widget-date">domingo, 22 de nov.</div>
          <div class="weather-pill" id="persist-badge">🔒 Salvo Permanente</div>
        </div>

        <div class="widget-card music-widget">
          <div>
            <div class="music-title" id="track-title">Hologram Pulse</div>

    // GERADOR DE ÍCONE/FOTO PNG DE ALTA DEFINIÇÃO DO APP (512x512)
    // =========================================================
    let APP_ICON_PNG_512 = './icon-512.svg';
    let APP_ICON_PNG_192 = './icon-512.svg';

    function generateHDAppIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Fundo escuro arredondado estilo App Nativo
      const r = size * 0.22;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();

      const bgGrad = ctx.createLinearGradient(0, 0, size, size);
      bgGrad.addColorStop(0, '#040b1a');
      bgGrad.addColorStop(0.5, '#091833');
      bgGrad.addColorStop(1, '#030712');
      ctx.fillStyle = bgGrad;
      ctx.fill();

      // Borda Neon Holográfica
      const borderGrad = ctx.createLinearGradient(0, 0, size, size);
      borderGrad.addColorStop(0, '#00f5d4');
      borderGrad.addColorStop(0.5, '#38bdf8');
      borderGrad.addColorStop(1, '#d946ef');
      ctx.lineWidth = size * 0.032;
      ctx.strokeStyle = borderGrad;
      ctx.stroke();

      // Anel Orbital Holográfico
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.34, 0, Math.PI * 2);
      ctx.lineWidth = size * 0.018;
      ctx.strokeStyle = 'rgba(0, 245, 212, 0.45)';
      ctx.stroke();

      // Dupla Hélice DNA Holográfica 3D
      const steps = 18;
      const topY = size * 0.24;
      const botY = size * 0.72;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const y = topY + t * (botY - topY);
        const angle = t * Math.PI * 2.4;
        const amp = size * 0.16;
        const x1 = size / 2 + Math.sin(angle) * amp;
        const x2 = size / 2 - Math.sin(angle) * amp;

        // Degrau conector
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.lineWidth = size * 0.012;
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
        ctx.stroke();

        // Esfera Ciano
        ctx.beginPath();
        ctx.arc(x1, y, size * 0.024, 0, Math.PI * 2);
        ctx.fillStyle = '#00f5d4';
        ctx.fill();

        // Esfera Magenta
        ctx.beginPath();
        ctx.arc(x2, y, size * 0.024, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2a85';
        ctx.fill();
      }

      // Etiqueta "DNA" nítida na base do ícone
      ctx.fillStyle = '#ffffff';
      ctx.font = `900 ${Math.round(size * 0.11)}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('DNA OS', size / 2, size * 0.89);

      return canvas.toDataURL('image/png');
    }

    const CORE_APPS = [
      { id: 'installapp', name: 'Baixar App', icon: '📲', favicon: null, isSystemIcon: true, action: () => openInstallModal() },
      { id: 'calc', name: 'Calculadora', icon: '🧮', action: () => openCalculator() },

      { id: 'settings', name: 'Ajustes DNA', icon: '⚙️', action: () => openSettings() }
    ];

    // Banco Permanente (IndexedDB + localStorage)
    const STORAGE_KEY = 'dna_launcher_permanent_v4';
    const DEFAULT_STATE = {
      holo: true,
      holoTheme: 'prismatic',
      cols: 4,
      indexedPhoneIds: ['whatsapp', 'instagram', 'youtube', 'chrome', 'maps', 'playstore'],
      customPlayApps: [],
      customWebApps: [],
      firstRunDone: false
    };

    let state = { ...DEFAULT_STATE };

    function openDNA_DB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('DNALauncherPermanentDB', 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('store')) {
            db.createObjectStore('store');
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadPermanentState() {
      try {
        const lsRaw = localStorage.getItem(STORAGE_KEY);
        if (lsRaw) {
          state = { ...DEFAULT_STATE, ...JSON.parse(lsRaw) };
        }
        const db = await openDNA_DB();
        const tx = db.transaction('store', 'readonly');
        const req = tx.objectStore('store').get('launcherState');
        req.onsuccess = () => {
          if (req.result) {
            state = { ...DEFAULT_STATE, ...req.result };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            applyVisualState();
            renderAll();
          } else {
            savePermanentState();
          }
        };
      } catch {}
    }

    async function savePermanentState() {
      const snapshot = JSON.parse(JSON.stringify(state));
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot)); } catch {}
      try {
        const db = await openDNA_DB();
        const tx = db.transaction('store', 'readwrite');
        tx.objectStore('store').put(snapshot, 'launcherState');
      } catch {}
    }

    function launchExternalApp(app) {
      if (app.url && app.url.startsWith('tel:')) {
        window.location.href = app.url;
        return;
      }
      const isAndroid = /Android/i.test(navigator.userAgent);
      if (isAndroid && app.pkg) {
        const cleanUrl = (app.url || `https://play.google.com/store/apps/details?id=${app.pkg}`).replace(/^https?:\/\//, '');
        const fallback = encodeURIComponent(app.url || `https://play.google.com/store/apps/details?id=${app.pkg}`);
        const intentUrl = `intent://${cleanUrl}#Intent;scheme=https;package=${app.pkg};S.browser_fallback_url=${fallback};end`;
        window.location.href = intentUrl;
      } else {
        window.open(app.url || `https://play.google.com/store/search?q=${encodeURIComponent(app.name)}&c=apps`, '_blank', 'noopener');
      }
    }

    function getAllApps() {
      const catalogSelected = PLAYSTORE_CATALOG
        .filter(p => state.indexedPhoneIds.includes(p.id))
        .map(p => ({
          ...p,
          removableType: 'catalog',
          action: () => launchExternalApp(p)
        }));

      const customPlay = (state.customPlayApps || []).map(p => ({
        ...p,
        removableType: 'customPlay',
        action: () => launchExternalApp(p)
      }));

      const webApps = (state.customWebApps || []).map(w => ({
        ...w,
        isWebApp: true,
        removableType: 'customWeb',
        action: () => window.open(w.url, '_blank', 'noopener')
      }));

      return [...catalogSelected, ...customPlay, ...webApps, ...CORE_APPS];
    }

    function applyVisualState() {
      document.body.classList.toggle('holo-mode', state.holo);
      document.body.classList.remove('holo-cyan', 'holo-solar');
      if (state.holoTheme === 'cyan') document.body.classList.add('holo-cyan');
      if (state.holoTheme === 'solar') document.body.classList.add('holo-solar');
      document.documentElement.style.setProperty('--grid-cols', state.cols);

      const btn = document.getElementById('holo-toggle-btn');
      btn.textContent = state.holo ? 'HOLO ON' : 'HOLO OFF';
      btn.classList.toggle('off', !state.holo);
    }

    document.getElementById('holo-toggle-btn').addEventListener('click', () => {
      state.holo = !state.holo;
      savePermanentState();
      applyVisualState();
    });

    function createAppElement(app, index, hideLabel = false) {
      const el = document.createElement('div');
      el.className = 'app-item';
      el.style.setProperty('--idx', index);

      let innerIcon = `<span class="app-glyph">${app.icon || '📱'}</span>`;
      if (app.isSystemIcon) {
        innerIcon = `<img class="favicon-holo" src="${APP_ICON_PNG_192}" alt="DNA App" />`;
      } else if (app.favicon) {
        innerIcon = `<img class="favicon-holo" src="${app.favicon}" onerror="this.outerHTML='<span class=\\'app-glyph\\'>${app.icon || '🌐'}</span>'" alt="" />`;
      }

      const badgeHtml = app.isWebApp && !hideLabel ? `<span class="web-tag">WEB</span>` : '';

      el.innerHTML = `
        <div class="app-icon-wrap">
          ${badgeHtml}
          ${innerIcon}
        </div>
        ${hideLabel ? '' : `<span class="app-label">${app.name}</span>`}
      `;

      el.addEventListener('pointermove', (e) => {
        const rect = el.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        el.style.transform = `perspective(400px) rotateY(${x * 24}deg) rotateX(${-y * 24}deg) scale(1.06)`;
      });

      el.addEventListener('pointerleave', () => {
        el.style.transform = '';
      });

      el.addEventListener('click', () => {
        if (app.action) app.action();
      });

      if (app.removableType && !hideLabel) {
        let pressTimer;
        el.addEventListener('pointerdown', () => {
          pressTimer = setTimeout(() => {
            if (confirm(`Deseja excluir "${app.name}" da sua tela inicial?`)) {
              deleteIndexedApp(app.removableType, app.id);
            }
          }, 800);
        });
        el.addEventListener('pointerup', () => clearTimeout(pressTimer));
        el.addEventListener('pointerleave', () => clearTimeout(pressTimer));
      }

      return el;
    }

    function deleteIndexedApp(type, id) {
      if (type === 'catalog') {
        state.indexedPhoneIds = state.indexedPhoneIds.filter(x => x !== id);
      } else if (type === 'customPlay') {
        state.customPlayApps = state.customPlayApps.filter(x => x.id !== id);
      } else if (type === 'customWeb') {
        state.customWebApps = state.customWebApps.filter(x => x.id !== id);
      }
      savePermanentState();
      renderAll();
    }

    function renderHome(filter = '') {
      const grid = document.getElementById('home-apps-grid');
      grid.innerHTML = '';
      const filtered = getAllApps().filter(a => a.name.toLowerCase().includes(filter.toLowerCase()));
      filtered.forEach((app, idx) => grid.appendChild(createAppElement(app, idx)));
    }

    function renderDock() {
      const dock = document.getElementById('dock-bar');
      dock.innerHTML = '';
      const whatsAppObj = PLAYSTORE_CATALOG.find(a => a.id === 'whatsapp');
      const dockItems = [
        { name: 'Telefone', icon: '📞', action: () => { window.location.href = 'tel:'; } },
        { name: 'WhatsApp', icon: '💬', action: () => launchExternalApp(whatsAppObj) },
        { name: 'Gaveta', icon: '💠', action: () => openDrawer() },
        { name: '+ Play Store', icon: '📥', action: () => openPhoneIndexer() },
        { name: 'Baixar App', icon: '📲', isSystemIcon: true, action: () => openInstallModal() }
      ];
      dockItems.forEach((item, idx) => dock.appendChild(createAppElement(item, idx, true)));
    }

    function renderAll() {
      renderHome(document.getElementById('app-search').value);
      renderDock();
    }

    // Indexador Play Store
    function openPhoneIndexer() {
      const renderCatalog = (q = '') => {
        const list = PLAYSTORE_CATALOG.filter(a => a.name.toLowerCase().includes(q.toLowerCase()));
        return list.map(app => {
          const active = state.indexedPhoneIds.includes(app.id);
          return `
            <div class="indexer-card ${active ? 'selected' : ''}" onclick="togglePhoneApp('${app.id}')">
              <span class="ic-emoji">${app.icon}</span>
              <span class="ic-name">${app.name}</span>
              <span class="ic-status">${active ? '✓ SALVO' : '+ INDEXAR'}</span>
            </div>
          `;
        }).join('');
      };

      const renderCustomPlayList = () => {
        if (!state.customPlayApps.length) return '';
        return `
          <div style="font-size:12px;font-weight:700;color:#00f5d4;margin-top:4px">Outros Apps da Play Store Indexados:</div>
          ${state.customPlayApps.map(p => `
            <div class="setting-row" style="background:rgba(15,23,42,0.8);padding:9px 12px;border-radius:12px;border:1px solid rgba(0,245,212,0.28)">
              <span>${p.icon} <b>${p.name}</b></span>
              <button class="chip danger" onclick="removeCustomPlayApp('${p.id}')">Excluir</button>
            </div>
          `).join('')}
        `;
      };

      openModal('📥 Indexar Apps da Play Store', `
        <p style="font-size:12px;color:#94a3b8;line-height:1.4">
          Marque os aplicativos que você tem no celular (WhatsApp, bancos, redes, etc.). Eles ficam <b>salvos permanentemente</b> e só saem se você excluir.
        </p>

        <div class="chip-row">
          <button class="chip active" onclick="indexAllPhoneApps()">Indexar Todos (${PLAYSTORE_CATALOG.length})</button>
          <button class="chip danger" onclick="clearPhoneApps()">Desmarcar Catálogo</button>
        </div>

        <div class="search-pill">
          <span>🔎</span>
          <input type="text" id="indexer-filter" placeholder="Buscar WhatsApp, banco, rede social..." oninput="filterIndexer(this.value)" />
        </div>

        <div class="indexer-grid" id="indexer-grid-container">
          ${renderCatalog()}
        </div>

        <div class="holo-form" style="margin-top:6px">
          <div style="font-size:12px;font-weight:800;color:#a5f3fc">➕ Indexar Outro App da Play Store (Manual)</div>
          <input class="holo-input" id="custom-play-name" placeholder="Nome do App (ex: Caixa, Kwai, Jogo...)" />
          <input class="holo-input" id="custom-play-pkg" placeholder="Link da Play Store ou pacote (opcional, ex: com.app)" />
          <input class="holo-input" id="custom-play-icon" placeholder="Emoji do ícone (ex: 🎮, 🏦, 📱)" maxlength="4" />
          <button class="holo-primary-btn" onclick="addCustomPlayApp()">💾 Salvar App Permanentemente</button>
        </div>

        ${renderCustomPlayList()}
      `);

      window.filterIndexer = (val) => {
        document.getElementById('indexer-grid-container').innerHTML = renderCatalog(val);
      };
    }

    window.togglePhoneApp = (id) => {
      if (state.indexedPhoneIds.includes(id)) {
        state.indexedPhoneIds = state.indexedPhoneIds.filter(x => x !== id);
      } else {
        state.indexedPhoneIds.push(id);
      }
      savePermanentState();
      renderAll();
      const q = document.getElementById('indexer-filter')?.value || '';
      window.filterIndexer(q);
    };

    window.indexAllPhoneApps = () => {
      state.indexedPhoneIds = PLAYSTORE_CATALOG.map(a => a.id);
      savePermanentState();
      renderAll();
      openPhoneIndexer();
    };

    window.clearPhoneApps = () => {
      if (confirm('Deseja desmarcar os aplicativos do catálogo?')) {
        state.indexedPhoneIds = [];
        savePermanentState();
        renderAll();
        openPhoneIndexer();
      }
    };

    window.addCustomPlayApp = () => {
      const name = document.getElementById('custom-play-name').value.trim();
      const rawPkg = document.getElementById('custom-play-pkg').value.trim();
      const icon = document.getElementById('custom-play-icon').value.trim() || '📱';

      if (!name) { alert('Digite o nome do aplicativo.'); return; }

      let pkg = '';
      if (rawPkg.includes('id=')) pkg = rawPkg.split('id=')[1].split('&')[0];
      else if (rawPkg.includes('.')) pkg = rawPkg;

      const url = pkg
        ? `https://play.google.com/store/apps/details?id=${pkg}`
        : `https://play.google.com/store/search?q=${encodeURIComponent(name)}&c=apps`;

      state.customPlayApps.push({ id: 'play_' + Date.now(), name, icon, pkg, url });
      savePermanentState();
      renderAll();
      openPhoneIndexer();
    };

    window.removeCustomPlayApp = (id) => {
      if (confirm('Excluir este aplicativo permanentemente?')) {
        state.customPlayApps = state.customPlayApps.filter(p => p.id !== id);
        savePermanentState();
        renderAll();
        openPhoneIndexer();
      }
    };

    // Web Apps em Holograma
    function openAddWebApp() {
      const savedListHtml = state.customWebApps.length
        ? state.customWebApps.map(w => `
            <div class="setting-row" style="background:rgba(15,23,42,0.8);padding:10px 12px;border-radius:12px;border:1px solid rgba(217,70,239,0.28)">
              <span>${w.icon} <b>${w.name}</b></span>
              <button class="chip danger" onclick="removeCustomWeb('${w.id}')">Excluir</button>
            </div>
          `).join('')
        : `<p style="font-size:12px;color:#64748b">Nenhum aplicativo web salvo ainda.</p>`;

      openModal('🌐 Web Apps em Holograma', `
        <div class="holo-form" style="border-color:rgba(217,70,239,0.4)">
          <p style="font-size:12px;color:#cbd5e1">
            Adicione qualquer site, sistema ou PWA (GitHub, Vercel, portais, etc.) para projetá-lo em <b>Holograma 3D</b> com salvamento permanente:
          </p>
          <input class="holo-input" id="web-app-name" placeholder="Nome do Web App (ex: Meu Sistema)" />
          <input class="holo-input" id="web-app-url" type="url" placeholder="Link URL (ex: https://seusite.github.io)" />
          <input class="holo-input" id="web-app-icon" placeholder="Emoji opcional (ex: 🚀, 🚖, 💼)" maxlength="4" />
          <button class="holo-primary-btn" onclick="saveNewWebApp()">✨ Salvar Web App em Holograma</button>
        </div>
        <div style="font-size:12px;font-weight:700;color:#a5f3fc;margin-top:4px">Web Apps Salvos (só saem se excluir):</div>
        ${savedListHtml}
      `);
    }

    window.saveNewWebApp = () => {
      const name = document.getElementById('web-app-name').value.trim();
      let url = document.getElementById('web-app-url').value.trim();
      const icon = document.getElementById('web-app-icon').value.trim() || '🌐';

      if (!name || !url) { alert('Preencha o nome e o link (URL) do aplicativo web.'); return; }
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      let favicon = '';
      try {
        const domain = new URL(url).hostname;
        favicon = `https://www.google.com/s2/favicons?sz=128&domain=${domain}`;
      } catch {}

      state.customWebApps.push({ id: 'web_' + Date.now(), name, url, icon, favicon });
      savePermanentState();
      renderAll();
      openAddWebApp();
    };

    window.removeCustomWeb = (id) => {
      if (confirm('Deseja excluir este Web App permanentemente?')) {
        state.customWebApps = state.customWebApps.filter(w => w.id !== id);
        savePermanentState();
        renderAll();
        openAddWebApp();
      }
    };

    // Gaveta
    function openDrawer() {
      const sheet = document.getElementById('drawer-sheet');
      const grid = document.getElementById('drawer-apps-grid');
      const renderList = (q = '') => {
        grid.innerHTML = '';
        getAllApps()
          .filter(a => a.name.toLowerCase().includes(q.toLowerCase()))
          .forEach((app, i) => grid.appendChild(createAppElement(app, i)));
      };
      renderList();
      document.getElementById('drawer-search').oninput = (e) => renderList(e.target.value);
      sheet.classList.add('open');
    }

    function closeSheet(id) {
      document.getElementById(id).classList.remove('open');
    }

    document.getElementById('app-search').addEventListener('input', (e) => renderHome(e.target.value));
    document.getElementById('app-search').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(e.target.value)}`, '_blank');
      }
    });

    // Relógio
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const dateStr = now.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' });
      document.getElementById('status-clock').textContent = timeStr;
      document.getElementById('widget-clock').textContent = timeStr;
      document.getElementById('widget-date').textContent = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Bateria
    if (navigator.getBattery) {
      navigator.getBattery().then(bat => {
        const updateBat = () => {
          document.getElementById('battery-txt').textContent = `${Math.round(bat.level * 100)}% ${bat.charging ? '⚡' : '🔋'}`;
        };
        updateBat();
        bat.addEventListener('levelchange', updateBat);
        bat.addEventListener('chargingchange', updateBat);
      });
    }

    // Player
    const TRACKS = [
      { title: 'Hologram Pulse', artist: 'DNA Synth Audio', freq: 220 },
      { title: 'Neon Orbit 3D', artist: 'Cyber Wave', freq: 261.63 },
      { title: 'Quantum Horizon', artist: 'Deep Space', freq: 329.63 }
    ];
    let trackIdx = 0, audioCtx = null, osc = null, isPlaying = false;

    function toggleMusic() {
      const btn = document.getElementById('play-track');
      if (!isPlaying) {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = TRACKS[trackIdx].freq;
        gain.gain.value = 0.04;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        isPlaying = true;
        btn.textContent = '⏸';
      } else {
        if (osc) osc.stop();
        isPlaying = false;
        btn.textContent = '▶';
      }
    }

    function changeTrack(dir) {
      trackIdx = (trackIdx + dir + TRACKS.length) % TRACKS.length;
      document.getElementById('track-title').textContent = TRACKS[trackIdx].title;
      document.getElementById('track-artist').textContent = TRACKS[trackIdx].artist;
      if (isPlaying) { toggleMusic(); toggleMusic(); }
    }

    document.getElementById('play-track').onclick = toggleMusic;
    document.getElementById('prev-track').onclick = () => changeTrack(-1);
    document.getElementById('next-track').onclick = () => changeTrack(1);

    // Mini-Apps
    function openModal(title, html) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('app-modal').classList.add('open');
    }

    function openCalculator() {
      openModal('🧮 Calculadora Holográfica', `
        <div class="calc-display" id="calc-res">0</div>
        <div class="calc-grid">
          ${['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(k =>
            `<button class="calc-key ${['/','*','-','+','='].includes(k) ? 'op' : ''}" onclick="pressCalc('${k}')">${k}</button>`
          ).join('')}
        </div>
      `);
    }

    let calcExpr = '';
    window.pressCalc = (k) => {
      const disp = document.getElementById('calc-res');
      if (k === 'C') { calcExpr = ''; disp.textContent = '0'; return; }
      if (k === '=') {
        try {
          calcExpr = String(Function('"use strict";return (' + calcExpr + ')')());
          disp.textContent = calcExpr;
        } catch { disp.textContent = 'Erro'; calcExpr = ''; }
        return;
      }
      calcExpr += k;
      disp.textContent = calcExpr;
    };

    function openNotes() {
      const saved = localStorage.getItem('dna_notes') || '';
      openModal('📝 Notas Holográficas', `
        <textarea class="notes-area" id="notes-input" placeholder="Anotações salvas permanentemente...">${saved}</textarea>
      `);
      document.getElementById('notes-input').addEventListener('input', (e) => {
        localStorage.setItem('dna_notes', e.target.value);
      });
    }

    function openTimer() {
      let sec = 0, interval = null;
      openModal('⏱️ Cronômetro DNA', `
        <div class="calc-display" style="text-align:center" id="timer-val">00:00</div>
        <div class="chip-row" style="justify-content:center">
          <button class="chip active" id="t-start">Iniciar</button>
          <button class="chip" id="t-pause">Pausar</button>
          <button class="chip" id="t-reset">Zerar</button>
        </div>
      `);
      const update = () => {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        const el = document.getElementById('timer-val');
        if (el) el.textContent = `${m}:${s}`;
      };
      document.getElementById('t-start').onclick = () => { if (!interval) interval = setInterval(() => { sec++; update(); }, 1000); };
      document.getElementById('t-pause').onclick = () => { clearInterval(interval); interval = null; };
      document.getElementById('t-reset').onclick = () => { clearInterval(interval); interval = null; sec = 0; update(); };
    }

    function openCamera() {
      openModal('📸 Holo Cam', `
        <video id="cam-feed" autoplay playsinline style="width:100%;border-radius:18px;border:1px solid #00f5d4;background:#000"></video>
      `);
      navigator.mediaDevices?.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => { document.getElementById('cam-feed').srcObject = stream; })
        .catch(() => {});
    }

    function openSettings() {
      openModal('⚙️ Ajustes DNA Launcher', `
        <div class="setting-group">
          <div class="setting-row">
            <span>Projeção Holográfica 3D</span>
            <button class="chip ${state.holo ? 'active' : ''}" onclick="toggleHoloSetting()">${state.holo ? 'Ativado' : 'Desativado'}</button>
          </div>
          <div>
            <div style="font-size:12px;color:#94a3b8;margin-bottom:8px">Espectro de Luz do Holograma</div>
            <div class="chip-row">
              <button class="chip ${state.holoTheme === 'prismatic' ? 'active' : ''}" onclick="setHoloTheme('prismatic')">Prismático</button>
              <button class="chip ${state.holoTheme === 'cyan' ? 'active' : ''}" onclick="setHoloTheme('cyan')">Ciano HUD</button>
              <button class="chip ${state.holoTheme === 'solar' ? 'active' : ''}" onclick="setHoloTheme('solar')">Solar Gold</button>
            </div>
          </div>
          <div>
            <div style="font-size:12px;color:#94a3b8;margin-bottom:8px">Colunas da Grade</div>
            <div class="chip-row">
              <button class="chip ${state.cols === 4 ? 'active' : ''}" onclick="setCols(4)">4 Colunas</button>
              <button class="chip ${state.cols === 5 ? 'active' : ''}" onclick="setCols(5)">5 Colunas</button>
            </div>
          </div>
          <button class="holo-primary-btn" onclick="openInstallModal()">📲 Baixar App na Tela do Celular</button>
          <button class="action-holo-btn" style="width:100%;padding:12px" onclick="openPhoneIndexer()">📥 Gerenciar Apps Play Store</button>
          <button class="action-holo-btn web" style="width:100%;padding:12px" onclick="openAddWebApp()">🌐 Gerenciar Web Apps Holográficos</button>
        </div>
      `);
    }

    window.toggleHoloSetting = () => { state.holo = !state.holo; savePermanentState(); applyVisualState(); openSettings(); };
    window.setHoloTheme = (t) => { state.holoTheme = t; savePermanentState(); applyVisualState(); openSettings(); };
    window.setCols = (c) => { state.cols = c; savePermanentState(); applyVisualState(); openSettings(); };

    // Inicialização
    loadPermanentState().then(() => {
      applyVisualState();
      renderAll();
      if (!state.firstRunDone) {
        state.firstRunDone = true;
        savePermanentState();
        setTimeout(() => openPhoneIndexer(), 500);
      }
    });
  </script>
</body>
</html>
